services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shanti_auto_mobiles
      POSTGRES_USER: sam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam -d shanti_auto_mobiles"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://sam:${POSTGRES_PASSWORD}@db:5432/shanti_auto_mobiles
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in .env}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  postgres_data:
